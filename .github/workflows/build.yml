name: build-windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar ejecutable autocontenido
        run: >
          dotnet publish src/InnovaEvidenceCapture/InnovaEvidenceCapture.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      # ffmpeg graba la pantalla y produce el MP4 ya listo para reproducir.
      # Se descarga aqui en vez de versionarlo: son ~80 MB de binario que no
      # tienen por que vivir en el repositorio.
      - name: Descargar ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontro ffmpeg.exe dentro del zip" }
          Copy-Item $exe.FullName publish/ffmpeg.exe
          Write-Host "ffmpeg listo: $([math]::Round((Get-Item publish/ffmpeg.exe).Length / 1MB, 1)) MB"

      - name: Agregar los scripts de instalacion al paquete
        shell: pwsh
        run: |
          Copy-Item installer/instalar.bat      publish/
          Copy-Item installer/desinstalar.bat   publish/
          Copy-Item GUIA-INSTALACION.md         publish/ -ErrorAction SilentlyContinue
          Get-ChildItem publish | Format-Table Name, Length

      - name: Publicar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: InnovaEvidenceCapture-win-x64
          path: publish/
